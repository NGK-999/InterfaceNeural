name: Verificação V1
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Verificar atualização do link de download
        run: node --test tests/test_download_link.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '*requirements*.lock'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m pytest
      - run: python -m muscle_monitor --smoke-test
      - run: python scripts/soak.py --headless --seconds 60 --rate 2000
      - run: python scripts/build.py
      - name: Smoke do pacote Linux
        if: runner.os == 'Linux'
        run: ./dist/MuscleMonitor/MuscleMonitor --smoke-test
      - name: Smoke do pacote Windows
        if: runner.os == 'Windows'
        run: |
          $process = Start-Process .\dist\MuscleMonitor\MuscleMonitor.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Gerar e verificar instalador Windows
        if: runner.os == 'Windows'
        run: ./scripts/windows-installer.ps1
      - name: Disponibilizar instalador Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MonitorMuscular-Instalador-Windows-x86_64
          path: dist/installer/MonitorMuscular-Instalar.exe
          if-no-files-found: error
      - name: Disponibilizar aplicativo completo
        uses: actions/upload-artifact@v4
        with:
          name: MuscleMonitor-${{ matrix.os }}-x86_64
          path: dist/MuscleMonitor/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-${{ matrix.os }}
          path: artifacts/
  download_link:
    name: Atualizar download no README
    needs: software
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publicar link direto do instalador aprovado
        uses: actions/github-script@v7
        with:
          script: |
            const update = require('./.github/scripts/update-download-link.cjs');
            const { downloadUrl } = await update({ github, context, core });
            await core.summary.addLink('Baixar instalador Windows (ZIP)', downloadUrl).write();

